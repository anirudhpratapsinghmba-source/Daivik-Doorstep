<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daivik Staff | Service & Payment</title>
<style>
:root{--a:#071014;--g:#20c96b;--p:#f4f7f5;--muted:#718087;--line:#dfe7e3;--red:#c92b2b}
*{box-sizing:border-box}body{margin:0;background:var(--p);color:var(--a);font-family:Inter,Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 14px 45px #0710140b}.login{max-width:460px;margin:10vh auto}.logo{font-weight:950;letter-spacing:.12em}.logo small{display:block;font-size:8px;letter-spacing:.22em;color:var(--muted);margin-top:4px}.sub,.hint{color:var(--muted);font-size:12px;line-height:1.55}.input,select{width:100%;padding:13px;border:1px solid #ccd7d2;border-radius:11px;margin:7px 0;font-size:14px;background:#fff}.btn{border:0;border-radius:11px;padding:12px 15px;background:var(--a);color:#fff;font-weight:850;cursor:pointer}.btn.green{background:var(--g);color:#06140b}.btn.light{background:#edf3ef;color:var(--a)}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.cards{display:grid;gap:16px}.card{display:grid;grid-template-columns:1fr 320px;gap:20px}.pill{display:inline-block;padding:6px 9px;border-radius:999px;background:#edf3ef;font-size:10px;font-weight:900;letter-spacing:.08em}.amount{font-size:30px;font-weight:950;margin:8px 0}.qr{border:1px dashed #b8c8c0;border-radius:16px;padding:14px;text-align:center;background:#fafcfb}.qr canvas,.qr img{max-width:210px;margin:auto}.paymentbox{display:none;margin-top:12px;padding:15px;background:#f5f8f6;border-radius:15px}.paymentbox.show{display:block}.method{display:flex;gap:8px}.method button{flex:1}.method .active{outline:3px solid #b9efd0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.error{color:var(--red);font-size:12px;min-height:18px}@media(max-width:760px){.card{grid-template-columns:1fr}.wrap{padding:12px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div id="login" class="panel login"><div class="logo">DAIVIK<small>SERVICE STAFF PORTAL</small></div><h1>Service Login</h1><p class="sub">Enter the service person's authorised email. We'll send a one-time login code/link.</p><input id="staffEmail" class="input" type="email" placeholder="staff@email.com" autocomplete="email"><button id="sendOtp" class="btn green" style="width:100%">Send Login Code</button><div id="otpBox" hidden><input id="otp" class="input" inputmode="numeric" maxlength="6" placeholder="6-digit code"><button id="verifyOtp" class="btn" style="width:100%">Verify Code</button></div><p id="loginMsg" class="error"></p></div>
<div id="app" hidden><div class="top"><div><div class="logo">DAIVIK<small>SERVICE STAFF PORTAL</small></div><h1 style="margin:8px 0 0">Today's Assigned Jobs</h1><div id="who" class="sub"></div></div><button id="logout" class="btn light">Log out</button></div><div id="cards" class="cards"></div><div id="empty" class="panel" hidden>No bookings are assigned to this staff account yet.</div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="assets/js/supabase-config.js?v=20261004-staff"></script><script src="assets/js/staff-portal.js?v=20261004-staff"></script>
</body></html>
