<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daivik Admin</title><style>body{font-family:Arial;margin:0;background:#f3f7f8;color:#17212b}.wrap{max-width:1400px;margin:30px auto;padding:15px}.panel{background:#fff;border-radius:16px;padding:20px;margin:15px 0}input,button,select{padding:10px;margin:5px;border-radius:7px;border:1px solid #ccd5d9}button{background:#16a34a;color:#fff;border:0;font-weight:700}.table{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1000px}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}th{background:#07141c;color:#fff}</style></head><body><div class="wrap"><div id="loginPanel" class="panel"><h1>Daivik Admin</h1><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Sign In</button><p id="loginMessage"></p></div><div id="dashboard" hidden><button id="logoutBtn">Logout</button><h1>Bookings</h1><p>Total: <b id="count">0</b></p><div class="panel table"><table><thead><tr><th>ID</th><th>Customer</th><th>Car</th><th>Service</th><th>Slot</th><th>Customer Location</th><th>Manage</th></tr></thead><tbody id="bookingRows"></tbody></table></div></div></div><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="assets/js/firebase-config.js"></script><script src="admin/admin.js"></script></body></html>
